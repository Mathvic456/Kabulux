// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    
    // Mapbox repository with authentication
    maven {
      url 'https://api.mapbox.com/downloads/v2/releases/maven'
      authentication {
        basic(BasicAuthentication)
      }
      credentials {
        username = 'mapbox'
        password = project.findProperty('MAPBOX_DOWNLOADS_TOKEN') ?: 
                   System.getenv('MAPBOX_DOWNLOADS_TOKEN') ?: ''
      }
    }
  }
  
  // Force resolution of correct Mapbox artifact
  configurations.all {
  resolutionStrategy {
    force 'com.mapbox.maps:android:11.8.0'
    eachDependency { DependencyResolveDetails details ->
      if (details.requested.group == 'com.mapbox.maps' && 
          details.requested.name.startsWith('android-ndk')) {
        details.useTarget 'com.mapbox.maps:android:11.11.0'
      }
    }
  }
}
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"